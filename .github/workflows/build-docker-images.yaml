name: Docker Image CI

on:
    push:
        branches: ["release-*", "prepare-for-deployment"]

jobs:
    build-and-push-listener:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v4
              with:
                  images: jkulak/grabtrack-listener
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=latest

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push "listener"
              uses: docker/build-push-action@v3
              with:
                  context: ./app
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
    build-and-push-www:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v4
              with:
                  images: jkulak/grabtrack-www
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=latest

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push "www"
              uses: docker/build-push-action@v3
              with:
                  context: ./www
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
